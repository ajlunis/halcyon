name: Build Watchface and Deploy Config Page

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-watchapp:
    name: Build Pebble Watchapp (.pbw)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify i18n
        run: npm run check:i18n

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Pebble Tool & SDK
        run: |
          uv tool install pebble-tool --python 3.13
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          $HOME/.local/bin/pebble sdk install latest
          chmod +x $HOME/.local/share/pebble-sdk/SDKs/current/node_modules/.bin/* || true

      - name: Build PBW
        run: |
          pebble build

      - name: Upload PBW Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Halcyon-pbw
          path: build/*.pbw

  deploy-config-page:
    name: Build & Deploy Config Page
    runs-on: ubuntu-latest
    needs: build-watchapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: config-page/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        working-directory: ./config-page
        run: npm ci

      - name: Build Config Page
        working-directory: ./config-page
        run: npx vite build

      - name: Download PBW Artifact
        uses: actions/download-artifact@v4
        with:
          name: Halcyon-pbw
          path: config-page/dist

      - name: Ensure PBW files in web dist
        run: |
          cd config-page/dist
          FIRST_PBW=$(ls *.pbw | head -n 1)
          if [ -n "$FIRST_PBW" ]; then
            cp "$FIRST_PBW" halcyon.pbw
            cp "$FIRST_PBW" Halcyon.pbw
          fi
          ls -la

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./config-page/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
